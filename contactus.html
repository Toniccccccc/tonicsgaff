    <div class="container text-center mt-4">
        <h2 class="text-primary">We'd Love to Hear from You!</h2>
        <p class="lead">Have questions? Feel free to reach out to us.</p>
    </div>

    <div class="container my-5 p-4 bg-white rounded-3 shadow-lg">
        <h3 class="text-center text-primary mb-4">Get in Touch</h3>

        <form>
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>

            <div class="mb-3">
                <label for="message" class="form-label">Your Message</label>
                <textarea class="form-control" id="message" rows="4" placeholder="Write your message here" required></textarea>
            </div>


            <div class="text-center">
                <button type="submit" class="btn btn-success px-4">Send Message</button>
            </div>
        </form>
    </div>


    <div class="container text-center my-5">
        <h4 class="text-primary">Follow Us on Social Media</h4>
        <p>Stay connected and updated with us!</p>
    </div>
        <div class="d-flex justify-content-center gap-3">
            <a href="https://facebook.com" target="_blank">
                <img src="assets/images/facebook.png.png" alt="Facebook" class="social-icon">
            </a>
            <a href="https://twitter.com" target="_blank">
                <img src="assets/images/twitter.png.png" alt="Twitter" class="social-icon">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="assets/images/instagram.png" alt="Instagram" class="social-icon">
